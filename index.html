<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tingxie Flashcards</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }

    .perspective-1000 {
      perspective: 1000px;
    }
    
    .preserve-3d {
      transform-style: preserve-3d;
    }
    
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    .card-inner {
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .is-flipped {
      transform: rotateY(180deg);
    }
    
    /* Animation for the speaker button */
    @keyframes pulse-emerald {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(16, 185, 129, 0); }
    }
    .speaking {
      animation: pulse-emerald 1.5s infinite;
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399; /* emerald-400 */
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4 text-slate-100">

  <!-- Header -->
  <div class="mb-8 text-center mt-4">
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-3 tracking-wide">
      听写练习
    </h1>
    <p class="text-slate-400 font-medium text-sm md:text-base bg-slate-800/50 px-4 py-1.5 rounded-full inline-block">
      发展汉语中级 1 - บทที่ 7
    </p>
  </div>

  <!-- Progress Counter -->
  <div class="bg-emerald-500/10 border border-emerald-500/20 px-5 py-2 rounded-full mb-8 shadow-sm">
    <p class="text-sm font-medium text-emerald-400 tracking-wider">
      คำที่ <span id="counter-current" class="font-bold text-emerald-300">1</span> / <span id="counter-total">45</span>
    </p>
  </div>

  <!-- Flashcard Container -->
  <div class="relative w-full max-w-sm h-96 md:h-[26rem] cursor-pointer group perspective-1000 mb-8" onclick="handleFlip()">
    
    <div id="card-inner" class="card-inner w-full h-full preserve-3d relative">
      
      <!-- Front of Card (Tingxie Mode - Audio Only) -->
      <div class="absolute w-full h-full backface-hidden bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 flex flex-col items-center justify-center p-8 text-center">
        <span class="text-slate-500 text-sm font-medium absolute top-6 left-6">No. <span id="front-id">1</span></span>
        
        <div class="flex-1 flex flex-col items-center justify-center w-full" id="audio-container">
          <button
            id="audio-btn"
            onclick="speakWord(event)"
            class="w-32 h-32 rounded-full flex items-center justify-center transition-all duration-300 bg-slate-700 text-slate-300 hover:bg-slate-600 hover:scale-105 hover:text-white shadow-xl"
            aria-label="Play audio"
          >
            <i data-lucide="volume-2" class="w-16 h-16"></i>
          </button>
          <p class="text-slate-400 mt-8 text-lg font-medium">กดเพื่อฟังเสียง</p>
        </div>

        <div id="no-audio-msg" class="hidden text-amber-400 flex-col items-center gap-2">
          <i data-lucide="volume-x" class="w-12 h-12"></i>
          <p class="text-sm">เบราว์เซอร์ไม่รองรับเสียงอ่าน</p>
        </div>

        <p class="text-xs text-slate-500 absolute bottom-6 flex items-center gap-2 bg-slate-900/50 px-4 py-2 rounded-full">
          <i data-lucide="eye" class="w-4 h-4"></i> แตะการ์ดเพื่อดูเฉลย
        </p>
      </div>

      <!-- Back of Card (Answers) -->
      <div class="absolute w-full h-full backface-hidden bg-emerald-600 rounded-3xl shadow-2xl border border-emerald-500 flex flex-col items-center justify-center p-8 text-center text-white rotate-y-180">
        <span class="text-emerald-200/60 text-sm font-medium absolute top-6 left-6">No. <span id="back-id">1</span></span>
        
        <div class="bg-emerald-900/30 px-3 py-1 rounded-md text-xs font-semibold mb-4 tracking-widest border border-emerald-400/20">
          ชนิดคำ: <span id="back-type">形</span>
        </div>
        
        <div id="back-word" class="text-6xl md:text-7xl font-medium text-white mb-2 tracking-wider">
          大方
        </div>
        
        <div id="back-pinyin" class="text-2xl md:text-3xl text-emerald-200 font-medium tracking-widest mb-6">
          dàfang
        </div>
        
        <div class="w-full h-px bg-emerald-400/30 mb-6"></div>
        
        <div id="back-thai" class="text-xl md:text-2xl font-bold mb-3 leading-tight text-white drop-shadow-md">
          ใจกว้าง, สง่าผ่าเผย
        </div>
        
        <div id="back-english" class="text-emerald-100 text-sm md:text-base font-medium">
          generous
        </div>

        <p class="text-xs text-emerald-200/70 absolute bottom-6 flex items-center gap-2">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i> แตะเพื่อกลับไปฟังเสียง
        </p>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="flex items-center gap-8">
    <button 
      onclick="handlePrev(event)"
      class="w-14 h-14 flex items-center justify-center rounded-2xl bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 hover:text-white transition-all active:scale-95 shadow-lg"
      aria-label="Previous card"
    >
      <i data-lucide="chevron-left" class="w-7 h-7"></i>
    </button>

    <button 
      onclick="handleNext(event)"
      class="w-14 h-14 flex items-center justify-center rounded-2xl bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 hover:text-white transition-all active:scale-95 shadow-lg"
      aria-label="Next card"
    >
      <i data-lucide="chevron-right" class="w-7 h-7"></i>
    </button>
  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    const vocabList = [
      { id: 1, word: '大方', pinyin: 'dàfang', type: '形', thai: 'ใจกว้าง, สง่าผ่าเผย', english: 'generous' },
      { id: 2, word: '期间', pinyin: 'qījiān', type: '名', thai: 'ช่วงเวลา', english: 'period' },
      { id: 3, word: '邀请', pinyin: 'yāoqǐng', type: '动', thai: 'เชิญ, เชื้อเชิญ', english: 'invite' },
      { id: 4, word: '新郎', pinyin: 'xīnláng', type: '名', thai: 'เจ้าบ่าว', english: 'bridegroom' },
      { id: 5, word: '新娘', pinyin: 'xīnniáng', type: '名', thai: 'เจ้าสาว', english: 'bride' },
      { id: 6, word: '敬酒', pinyin: 'jìng jiǔ', type: '动', thai: 'ดื่มอวยพร, ชนแก้ว', english: 'propose a toast' },
      { id: 7, word: '贺卡', pinyin: 'hèkǎ', type: '名', thai: 'การ์ดอวยพร', english: 'greeting card' },
      { id: 8, word: '神秘', pinyin: 'shénmì', type: '形', thai: 'ลึกลับ', english: 'mysterious' },
      { id: 9, word: '护身符', pinyin: 'hùshēnfú', type: '名', thai: 'เครื่องราง, ของขลัง', english: 'amulet' },
      { id: 10, word: '说明', pinyin: 'shuōmíng', type: '动', thai: 'อธิบาย, แสดงให้เห็น', english: 'show; indicate' },
      { id: 11, word: '反正', pinyin: 'fǎnzhèng', type: '副', thai: 'ถึงอย่างไรก็...', english: 'anyway; anyhow' },
      { id: 12, word: '掏', pinyin: 'tāo', type: '动', thai: 'ล้วง, หยิบออกมา', english: 'draw out' },
      { id: 13, word: '塞', pinyin: 'sāi', type: '动', thai: 'ยัด, อุด', english: 'stuff into' },
      { id: 14, word: '穷鬼', pinyin: 'qióng guǐ', type: '名', thai: 'คนจน (คำดูถูก)', english: 'the poor' },
      { id: 15, word: '物价', pinyin: 'wùjià', type: '名', thai: 'ราคาสินค้า', english: 'price of commodities' },
      { id: 16, word: '惊喜', pinyin: 'jīngxǐ', type: '形', thai: 'ประหลาดใจและดีใจ (เซอร์ไพรส์)', english: 'pleasant surprise' },
      { id: 17, word: '轻松', pinyin: 'qīngsōng', type: '形', thai: 'ผ่อนคลาย, สบายๆ', english: 'relaxed' },
      { id: 18, word: '待', pinyin: 'dāi', type: '动', thai: 'พัก, อาศัยอยู่', english: 'stay' },
      { id: 19, word: '似乎', pinyin: 'sìhū', type: '副', thai: 'ดูเหมือนว่า', english: 'as if; it seems' },
      { id: 20, word: '在乎', pinyin: 'zàihu', type: '动', thai: 'แคร์, ใส่ใจ', english: 'care about' },
      { id: 21, word: '面子', pinyin: 'miànzi', type: '名', thai: 'หน้าตา, ศักดิ์ศรี', english: 'face; reputation' },
      { id: 22, word: '偶尔', pinyin: 'ǒu\'ěr', type: '副', thai: 'เป็นบางครั้งบางคราว', english: 'occasionally' },
      { id: 23, word: '环境', pinyin: 'huánjìng', type: '名', thai: 'สภาพแวดล้อม', english: 'surroundings; environment' },
      { id: 24, word: '优雅', pinyin: 'yōuyǎ', type: '形', thai: 'สง่างาม, ประณีต', english: 'elegant' },
      { id: 25, word: '抢', pinyin: 'qiǎng', type: '动', thai: 'แย่งชิง', english: 'try to be the first' },
      { id: 26, word: '撕', pinyin: 'sī', type: '动', thai: 'ฉีก', english: 'tear; rip' },
      { id: 27, word: '价签', pinyin: 'jiàqiān', type: '名', thai: 'ป้ายราคา', english: 'price tag' },
      { id: 28, word: '花招', pinyin: 'huāzhāo', type: '名', thai: 'ลูกเล่น, เล่ห์เหลี่ยม', english: 'trick' },
      { id: 29, word: '马虎', pinyin: 'mǎhu', type: '形', thai: 'สะเพร่า, ลวกๆ', english: 'careless' },
      { id: 30, word: '传统', pinyin: 'chuántǒng', type: '名', thai: 'ประเพณี, ธรรมเนียมดั้งเดิม', english: 'tradition' },
      { id: 31, word: '评价', pinyin: 'píngjià', type: '动', thai: 'ประเมิน, วิจารณ์', english: 'evaluate; assess' },
      { id: 32, word: '就算', pinyin: 'jiùsuàn', type: '连', thai: 'ถึงแม้ว่า', english: 'even if' },
      { id: 33, word: '能力', pinyin: 'nénglì', type: '名', thai: 'ความสามารถ', english: 'ability' },
      { id: 34, word: '强', pinyin: 'qiáng', type: '形', thai: 'แข็งแกร่ง, เก่ง', english: 'strong' },
      { id: 35, word: '人均', pinyin: 'rénjūn', type: '名/动', thai: 'เฉลี่ยต่อคน', english: 'per capita' },
      { id: 36, word: '收入', pinyin: 'shōurù', type: '名', thai: 'รายได้', english: 'income' },
      { id: 37, word: '理想', pinyin: 'lǐxiǎng', type: '形', thai: 'อุดมคติ', english: 'ideal' },
      { id: 38, word: '场所', pinyin: 'chǎngsuǒ', type: '名', thai: 'สถานที่', english: 'place; venue' },
      { id: 39, word: '自然', pinyin: 'zìrán', type: '形', thai: 'ธรรมชาติ', english: 'natural' },
      { id: 40, word: '富', pinyin: 'fù', type: '形', thai: 'ร่ำรวย', english: 'rich; wealthy' },
      { id: 41, word: '捐', pinyin: 'juān', type: '动', thai: 'บริจาค', english: 'donate' },
      { id: 42, word: '观念', pinyin: 'guānniàn', type: '名', thai: 'ค่านิยม, แนวความคิด', english: 'concept' },
      { id: 43, word: '办学', pinyin: 'bànxué', type: '动', thai: 'บริหาร/จัดตั้งโรงเรียน', english: 'run a school' },
      { id: 44, word: '追求', pinyin: 'zhuīqiú', type: '动', thai: 'แสวงหา', english: 'pursue' },
      { id: 45, word: '要不然', pinyin: 'yàoburán', type: '连', thai: 'มิฉะนั้น', english: 'otherwise' },
    ];

    // State variables
    let currentIndex = 0;
    let isFlipped = false;
    let isSpeaking = false;
    let chineseVoice = null;
    let speechAvailable = ('speechSynthesis' in window);

    // DOM Elements
    const cardInner = document.getElementById('card-inner');
    const audioBtn = document.getElementById('audio-btn');
    const audioContainer = document.getElementById('audio-container');
    const noAudioMsg = document.getElementById('no-audio-msg');
    
    // Setup Speech Synthesis
    if (speechAvailable) {
      const loadVoices = () => {
        const voices = window.speechSynthesis.getVoices();
        chineseVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn')) || null;
      };
      
      loadVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    } else {
      audioContainer.classList.add('hidden');
      noAudioMsg.classList.remove('hidden');
      noAudioMsg.classList.add('flex');
    }

    function speakWord(e) {
      if (e) e.stopPropagation(); // Prevent card from flipping
      
      if (!speechAvailable || isSpeaking) return;

      const currentWord = vocabList[currentIndex];
      window.speechSynthesis.cancel(); // Stop any current speech

      const utterance = new SpeechSynthesisUtterance(currentWord.word);
      if (chineseVoice) utterance.voice = chineseVoice;
      utterance.lang = 'zh-CN';
      utterance.rate = 0.8; // Slightly slower for dictation

      utterance.onstart = () => {
        isSpeaking = true;
        audioBtn.classList.add('speaking');
      };
      
      utterance.onend = () => {
        isSpeaking = false;
        audioBtn.classList.remove('speaking');
      };
      
      utterance.onerror = () => {
        isSpeaking = false;
        audioBtn.classList.remove('speaking');
      };

      window.speechSynthesis.speak(utterance);
    }

    function updateUI() {
      const currentWord = vocabList[currentIndex];
      
      // Update Progress
      document.getElementById('counter-current').innerText = currentIndex + 1;
      document.getElementById('counter-total').innerText = vocabList.length;

      // Update Front
      document.getElementById('front-id').innerText = currentWord.id;

      // Update Back
      document.getElementById('back-id').innerText = currentWord.id;
      document.getElementById('back-type').innerText = currentWord.type;
      document.getElementById('back-word').innerText = currentWord.word;
      document.getElementById('back-pinyin').innerText = currentWord.pinyin;
      document.getElementById('back-thai').innerText = currentWord.thai;
      document.getElementById('back-english').innerText = currentWord.english;

      // Stop speech if changing cards
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      isSpeaking = false;
      audioBtn.classList.remove('speaking');
    }

    function handleFlip() {
      isFlipped = !isFlipped;
      if (isFlipped) {
        cardInner.classList.add('is-flipped');
      } else {
        cardInner.classList.remove('is-flipped');
      }
    }

    function handleNext(e) {
      if (e) e.stopPropagation();
      if (isFlipped) handleFlip();
      
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % vocabList.length;
        updateUI();
      }, 150); // Small delay to sync with unflip animation
    }

    function handlePrev(e) {
      if (e) e.stopPropagation();
      if (isFlipped) handleFlip();
      
      setTimeout(() => {
        currentIndex = (currentIndex - 1 + vocabList.length) % vocabList.length;
        updateUI();
      }, 150);
    }

    // Initialize UI on load
    updateUI();
  </script>
</body>
</html>
